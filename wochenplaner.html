<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Janas Woche</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Layout: Kopf + Wochenziele-Leiste, darunter 7 Tageskarten; jeder Tag hat eine Tag-Auswahl als Shortcut */
  :root {
    --bg: #fdf6fa; --card: #ffffff; --text: #4a3f55; --muted: #85798f;
    --border: #f0e3ef; --soft: #fbeaf2; --accent: #f2a9c8; --accent-2: #cdb7ef;
    --accent-ink: #b8557f; --on-accent: #4a2340; --today: #fff3f8; --chip-ink: #3b3040; --tint: 40%;
    --c-ern: #a6dcc2; --c-bew: #f8cfa0; --c-schlaf: #cdb4e8; --c-gehirn: #a9c8ec;
    --c-sozial: #f4a7b9; --c-psyche: #c6e3a9; --c-allg: #f6df96; --c-eigen: #e3d3c8;
    --font-display: Fraunces, Georgia, serif;
    --font-body: Nunito, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1a24; --card: #2a2431; --text: #f3ecf7; --muted: #ab9fb8;
      --border: #3b3245; --soft: #362c3d; --accent: #f0b3cf; --accent-2: #c9b3ec;
      --accent-ink: #f0b3cf; --on-accent: #3a2233; --today: #33293a; --tint: 30%;
      --c-ern: #8fcfb0; --c-bew: #f2c08a; --c-schlaf: #c2a6e6; --c-gehirn: #97bbe8;
      --c-sozial: #f09bb0; --c-psyche: #b5d996; --c-allg: #eed585; --c-eigen: #d4c2b6;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
      --bg: #1f1a24; --card: #2a2431; --text: #f3ecf7; --muted: #ab9fb8;
      --border: #3b3245; --soft: #362c3d; --accent: #f0b3cf; --accent-2: #c9b3ec;
      --accent-ink: #f0b3cf; --on-accent: #3a2233; --today: #33293a; --tint: 30%;
      --c-ern: #8fcfb0; --c-bew: #f2c08a; --c-schlaf: #c2a6e6; --c-gehirn: #97bbe8;
      --c-sozial: #f09bb0; --c-psyche: #b5d996; --c-allg: #eed585; --c-eigen: #d4c2b6;
      color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font-body); }
  main { max-width: 1280px; margin: 0 auto; padding-block: 28px 120px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 18px; }
  @media (min-width: 1560px) { main { max-width: 1560px; } }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); line-height: 1.1; }
  button, input, select, textarea { font: inherit; color: var(--text); }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; min-width: 0; }
  .muted { color: var(--muted); }

  .top { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
  .week { color: var(--muted); margin-top: 4px; }
  .nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: .9rem; }
  .pill:hover { border-color: var(--accent); }
  .pill.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  /* Tage */
  .days { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); align-items: start; }
  .day > * { min-width: 0; }
  @media (min-width: 1560px) { .days { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
  .day { display: flex; flex-direction: column; gap: 10px; min-height: 170px; }
  .day.today { background: var(--today); border-color: var(--accent); }
  .day-head { display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; justify-content: space-between; }
  .day-head h3 { font-size: 1.1rem; }
  .day-head .date { color: var(--muted); font-size: .85rem; }
  .badge { margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--accent); color: var(--on-accent);
    font: 800 .7rem var(--font-body); vertical-align: middle; }
  ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; flex: 1; align-content: flex-start; }
  .empty { color: var(--muted); font-size: .85rem; font-style: italic; }
  .item { display: inline-flex; align-items: center; border-radius: 999px; background: color-mix(in srgb, var(--c) var(--tint), var(--card));
    border: 1px solid color-mix(in srgb, var(--c) 70%, transparent); overflow: hidden; max-width: 100%; }
  .item .toggle { border: none; background: none; padding: 5px 4px 5px 10px; display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-size: .88rem; min-width: 0; text-align: left; }
  .item .toggle::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--c) 60%, var(--text)); flex: none; }
  .item.done { background: var(--c); }
  .item.done .toggle { color: var(--chip-ink); }
  .item.done .toggle::before { content: "✓"; border-color: transparent; background: var(--card); color: var(--accent-ink); font-size: .65rem; display: grid; place-items: center; font-weight: 900; }
  .item .x { border: none; background: none; padding: 5px 10px 5px 4px; color: var(--muted); font-size: 1rem; line-height: 1; }
  .item.done .x { color: var(--chip-ink); opacity: .6; }

  .add-btn { align-self: flex-start; border: 1px dashed var(--accent); background: none; color: var(--accent-ink); border-radius: 999px; padding: 4px 14px; font-weight: 800; font-size: .88rem; }
  .add-btn[aria-expanded="true"] { background: var(--accent); color: var(--on-accent); border-style: solid; }
  .picker { border-top: 1px dashed var(--border); padding-top: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .picker .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { border: 1px solid color-mix(in srgb, var(--c) 80%, transparent); background: var(--card); border-radius: 999px; padding: 4px 11px; font-size: .84rem; font-weight: 700; }
  .picker .tag:hover { background: color-mix(in srgb, var(--c) var(--tint), var(--card)); }
  .tag[aria-pressed="true"] { background: var(--c); color: var(--chip-ink); }
  .tag[aria-pressed="true"]::before { content: "✓ "; }
  .picker form { display: flex; gap: 6px; }
  .picker input { flex: 1; min-width: 0; border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 6px 10px; }
  .picker form button { border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 6px 12px; font-weight: 800; }

  /* Tags verwalten + Notiz */
  .two { display: grid; gap: 18px; grid-template-columns: 1fr; }
  @media (min-width: 860px) { .two { grid-template-columns: 1.3fr 1fr; } }
  .two h2 { font-size: 1.15rem; margin-bottom: 8px; }
  .manage .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .manage .tag { display: inline-flex; gap: 6px; align-items: center; background: color-mix(in srgb, var(--c) var(--tint), var(--card)); }
  .manage .tag button { border: none; background: none; padding: 0; color: var(--muted); font-weight: 800; }
  .manage .tag button.armed { color: var(--accent-ink); }
  .manage form { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .manage form input, .manage form select { border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 6px 10px; min-width: 0; }
  .manage form input[name=name] { flex: 1 1 160px; }
  .manage .hint { font-size: .85rem; color: var(--muted); margin: 0 0 10px; }
  textarea { width: 100%; min-height: 110px; resize: vertical; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; background: var(--card); }
  .motto { text-align: center; color: var(--muted); font-size: .9rem; max-width: 60ch; margin: 4px auto 0; }

  /* Spruch unter der Überschrift */
  .quote { margin-top: 10px; border: none; background: var(--soft); color: var(--text); border-radius: 14px; padding: 7px 14px;
    font-family: var(--font-display); font-style: italic; font-size: 1.02rem; text-align: left; max-width: 62ch; line-height: 1.4; }
  .quote::before { content: "„"; } .quote::after { content: "“"; }
  .quote:hover { background: color-mix(in srgb, var(--accent) 25%, var(--soft)); }

  /* Pixel-Labrador */
  .dog { position: fixed; left: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); width: 96px; height: 72px; pointer-events: none; z-index: 20; will-change: transform; }
  .dog canvas { width: 96px; height: 72px; image-rendering: pixelated; display: block; }
  .dog.left canvas { transform: scaleX(-1); }
  .bubble { position: absolute; bottom: 70px; left: 0; background: var(--card); color: var(--text); border: 2px solid var(--accent);
    border-radius: 12px; padding: 3px 10px; font: 800 .85rem var(--font-body); white-space: nowrap; opacity: 0; transition: opacity .15s, transform .15s; }
  .bubble.show { opacity: 1; transform: translateY(-4px); }
  .bubble::after { content: ""; position: absolute; left: var(--arrow, 50%); bottom: -7px; width: 10px; height: 10px; margin-left: -5px; background: var(--card);
    border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(45deg); }
  @media (prefers-reduced-motion: reduce) { .bubble { transition: none; } }
</style>
</head>
<body>

<main>
  <header class="top">
    <div>
      <h1>Janas Woche</h1>
      <div class="week" id="weekLabel"></div>
      <button class="quote" id="quote" type="button" title="Antippen für einen neuen Spruch"></button>
    </div>
    <div class="nav">
      <button class="pill" id="prev" aria-label="Vorherige Woche">← Woche</button>
      <button class="pill primary" id="today">Heute</button>
      <button class="pill" id="next" aria-label="Nächste Woche">Woche →</button>
    </div>
  </header>

  <section class="days" id="days"></section>

  <div class="two">
    <section class="card manage">
      <h2>Meine Gewohnheiten</h2>
      <p class="hint">Deine Gewohnheiten erscheinen bei jedem Tag unter „+ Tag“. Eigene kannst du hier oder direkt bei einem Tag anlegen.</p>
      <div class="row" id="tagList"></div>
      <form id="tagForm">
        <input name="name" id="newTagName" placeholder="Neue Gewohnheit, z. B. Yoga" aria-label="Name der neuen Gewohnheit" required>
        <select name="area" id="areaSelect" aria-label="Bereich"></select>
        <button class="pill primary" type="submit">Anlegen</button>
      </form>
    </section>
    <section class="card">
      <h2>Wochen-Notiz</h2>
      <textarea id="note" placeholder="Was lief gut? Worauf achte ich nächste Woche?"></textarea>
    </section>
  </div>

  <p class="motto">Entscheidend ist die langfristige Gewohnheit, nicht Perfektion.</p>
</main>

<div class="dog" id="dog" aria-hidden="true"><div class="bubble" id="bubble"></div><canvas id="dogCanvas" width="32" height="24"></canvas></div>

<script>
(() => {
  const KEY = 'janas-woche.v2';
  const DAYS = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
  const AREAS = { bew: 'Bewegung', ern: 'Ernährung', schlaf: 'Schlaf', gehirn: 'Gehirn', sozial: 'Soziales', psyche: 'Erholung', allg: 'Gesundheit', eigen: 'Eigenes' };
  const DEFAULT_TAGS = [
    ['kraft', 'Krafttraining', 'bew', 2], ['ausdauer', 'Ausdauer', 'bew', 3], ['spazieren', 'Spazieren', 'bew'], ['rad', 'Fahrrad', 'bew'],
    ['gemuese', 'Obst & Gemüse', 'ern'], ['huelsen', 'Hülsenfrüchte', 'ern', 3], ['fisch', 'Fisch / Omega-3', 'ern', 1], ['vollkorn', 'Vollkorn', 'ern'], ['wasser', 'Viel Wasser', 'ern'],
    ['schlafen', 'Früh ins Bett', 'schlaf'], ['handy', 'Handyfrei vorm Schlafen', 'schlaf'],
    ['lesen', 'Lesen', 'gehirn', 3], ['lernen', 'Neues lernen', 'gehirn'],
    ['freunde', 'Freunde treffen', 'sozial', 2], ['familie', 'Familie', 'sozial'],
    ['entspannen', 'Entspannen', 'psyche'], ['hobby', 'Hobby-Zeit', 'psyche'],
    ['zahnseide', 'Zahnzwischenräume', 'allg'], ['sonne', 'Sonnenschutz', 'allg'], ['alkoholfrei', 'Alkoholfrei', 'allg'], ['vorsorge', 'Vorsorge / Arzt', 'allg'],
  ].map(([id, name, area]) => ({ id, name, area }));

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  let state = { tags: DEFAULT_TAGS, weeks: {} };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.tags) state = s; } catch {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

  const startOfWeek = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const key = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  function isoWeek(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
  }

  let monday = startOfWeek(new Date());
  let openDay = -1;
  const week = () => (state.weeks[key(monday)] ||= { days: [[], [], [], [], [], [], []], note: '' });
  const tagOf = (id) => state.tags.find(t => t.id === id);
  const areaOf = (it) => it.tag ? (tagOf(it.tag)?.area || 'eigen') : 'eigen';
  const labelOf = (it) => it.tag ? (tagOf(it.tag)?.name || it.text || '?') : it.text;

  $('areaSelect').innerHTML = Object.entries(AREAS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');

  function render() {
    const w = week();
    const todayKey = key(new Date());
    const fmt = (d, o) => d.toLocaleDateString('de-DE', o);
    $('weekLabel').textContent = `KW ${isoWeek(monday)} · ${fmt(monday, { day: 'numeric', month: 'long' })} – ${fmt(addDays(monday, 6), { day: 'numeric', month: 'long', year: 'numeric' })}`;

    $('days').innerHTML = DAYS.map((name, i) => {
      const d = addDays(monday, i), items = w.days[i], isToday = key(d) === todayKey, open = openDay === i;
      const used = new Set(items.map(it => it.tag).filter(Boolean));
      return `<article class="card day ${isToday ? 'today' : ''}" data-day="${i}">
        <div class="day-head"><h3>${name}${isToday ? '<span class="badge">heute</span>' : ''}</h3><span class="date">${fmt(d, { day: 'numeric', month: 'short' })}</span></div>
        <ul class="items">${items.length ? items.map(it => `
          <li class="item ${it.done ? 'done' : ''}" style="--c: var(--c-${areaOf(it)})">
            <button class="toggle" data-toggle="${it.id}" aria-pressed="${!!it.done}" title="Erledigt umschalten">${esc(labelOf(it))}</button>
            <button class="x" data-del="${it.id}" aria-label="${esc(labelOf(it))} entfernen">×</button>
          </li>`).join('') : '<li class="empty">Noch nichts ausgewählt</li>'}</ul>
        <button class="add-btn" data-open="${i}" aria-expanded="${open}">${open ? 'Fertig' : '+ Tag'}</button>
        ${open ? `<div class="picker">
          <div class="tags">${state.tags.map(t => `<button class="tag" style="--c: var(--c-${t.area})" data-pick="${t.id}" aria-pressed="${used.has(t.id)}">${esc(t.name)}</button>`).join('')}</div>
          <form data-custom="${i}"><input name="text" id="custom-${i}" placeholder="Eigene Gewohnheit…" aria-label="Eigener Eintrag für ${name}" autocomplete="off"><button type="submit">+</button></form>
        </div>` : ''}
      </article>`;
    }).join('');

    $('tagList').innerHTML = Object.keys(AREAS).flatMap(a => state.tags.filter(t => t.area === a)).map(t =>
      `<span class="tag" style="--c: var(--c-${t.area})">${esc(t.name)}<button data-rmtag="${t.id}" aria-label="Tag ${esc(t.name)} löschen">×</button></span>`).join('');

    $('note').value = w.note || '';
  }

  $('days').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const w = week(), day = +b.closest('[data-day]').dataset.day;
    if (b.dataset.open !== undefined) { openDay = openDay === day ? -1 : day; render(); return; }
    if (b.dataset.pick) {
      const list = w.days[day], idx = list.findIndex(i => i.tag === b.dataset.pick);
      if (idx >= 0) list.splice(idx, 1); else list.push({ id: uid(), tag: b.dataset.pick, done: false });
      save(); render(); return;
    }
    if (b.dataset.toggle) {
      const it = w.days[day].find(i => i.id === b.dataset.toggle); it.done = !it.done; save(); render();
      if (it.done) { e.dogHandled = true; window.janaDog?.happy(); }
      return;
    }
    if (b.dataset.del) { w.days[day] = w.days[day].filter(i => i.id !== b.dataset.del); save(); render(); }
  });
  $('days').addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target, day = +f.dataset.custom, text = f.text.value.trim();
    if (!text) return;
    let t = state.tags.find(x => x.name.toLowerCase() === text.toLowerCase());
    if (!t) { t = { id: 't' + uid(), name: text, area: 'eigen' }; state.tags.push(t); }
    const list = week().days[day];
    if (!list.some(i => i.tag === t.id)) list.push({ id: uid(), tag: t.id, done: false });
    save(); render();
    $(`custom-${day}`)?.focus();
  });

  $('tagList').addEventListener('click', (e) => {
    const b = e.target.closest('[data-rmtag]');
    if (!b) return;
    if (!b.classList.contains('armed')) {
      b.classList.add('armed'); b.textContent = 'löschen?';
      setTimeout(() => { if (b.isConnected) { b.classList.remove('armed'); b.textContent = '×'; } }, 3000);
      return;
    }
    const t = tagOf(b.dataset.rmtag);
    // Schon eingetragene Tage behalten den Namen als eigenen Eintrag
    for (const w of Object.values(state.weeks)) for (const d of w.days) for (const it of d) if (it.tag === t.id) { it.text = t.name; delete it.tag; }
    state.tags = state.tags.filter(x => x.id !== t.id);
    save(); render();
  });
  $('tagForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target, name = f.name.value.trim();
    if (!name) return;
    state.tags.push({ id: 't' + uid(), name, area: f.area.value });
    f.name.value = '';
    save(); render();
  });
  $('note').addEventListener('input', (e) => { week().note = e.target.value; save(); });
  $('prev').addEventListener('click', () => { monday = addDays(monday, -7); openDay = -1; render(); });
  $('next').addEventListener('click', () => { monday = addDays(monday, 7); openDay = -1; render(); });
  $('today').addEventListener('click', () => { monday = startOfWeek(new Date()); openDay = -1; render(); });

  render();
})();
</script>

<script>
(() => {
  // Motivationssprüche
  const QUOTES = [
    'Kleine Schritte zählen auch.', 'Fortschritt, nicht Perfektion.', 'Du musst nicht alles schaffen, nur dranbleiben.',
    'Heute ein bisschen besser als gestern reicht völlig.', 'Dein zukünftiges Ich sagt jetzt schon Danke.', 'Pausen gehören zum Plan.',
    'Bewegung ist ein Geschenk an deinen Kopf.', 'Eine gute Woche fängt mit einem Häkchen an.', 'Dranbleiben schlägt Durchziehen.',
    'Sei stolz auf jeden kleinen Haken.', 'Du bist auf einem richtig guten Weg, Jana.', 'Schlaf ist Training für den Kopf.',
    'Ein Spaziergang ist nie verschwendet.', 'Freunde treffen ist auch Gesundheit.', 'Neugierig bleiben hält jung.',
    'Du hast schon so viel geschafft.', 'Ein Tag ohne Häkchen ist kein Rückschritt.', 'Stark ist, wer dranbleibt.',
    'Gönn dir heute etwas Gutes.', 'Atme durch. Du machst das gut.', 'Heute ist ein guter Tag für einen guten Tag.',
    'Dein Körper merkt sich jeden guten Tag.', 'Langsam ist auch eine Geschwindigkeit.', 'Mach es dir leicht, dann bleibt es leicht.',
    'Gewohnheiten sind kleine Versprechen an dich selbst.', 'Du darfst stolz auf dich sein.', 'Jeder Haken ist ein kleiner Sieg.',
    'Gesund ist kein Ziel, sondern ein Weg, den du gerade gehst.',
  ];
  const q = document.getElementById('quote');
  let last = -1;
  try { last = +localStorage.getItem('janas-woche.quote'); } catch {}
  function nextQuote() {
    let i; do { i = Math.floor(Math.random() * QUOTES.length); } while (i === last);
    last = i; q.textContent = QUOTES[i];
    try { localStorage.setItem('janas-woche.quote', i); } catch {}
  }
  q.addEventListener('click', nextQuote);
  nextQuote();

  // Pixel-Labrador: 32×24 Pixel, dreifach vergrößert
  const el = document.getElementById('dog'), cv = document.getElementById('dogCanvas'), bubble = document.getElementById('bubble');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const C = { o: '#5b3d26', b: '#ecc173', l: '#f8e2b0', e: '#c99044', n: '#2a1a12', t: '#f292ad', c: '#f2a9c8', s: 'rgba(60,30,40,.15)' };
  let x = 24, dir = 1, frame = 0, lastT = 0, acc = 0, happyUntil = 0, hideTimer;

  function draw(t) {
    ctx.clearRect(0, 0, 32, 24);
    const happy = t < happyUntil, walk = !happy && !reduce, f = frame % 4;
    const jump = happy && !reduce ? Math.round(Math.abs(Math.sin(t / 110)) * 3) : 0;
    const bob = walk && (f === 1 || f === 3) ? -1 : 0;
    const Y = (v) => v - jump + bob;
    const fill = (px, py, w, h, c) => { ctx.fillStyle = C[c]; ctx.fillRect(px, py, w, h); };

    ctx.fillStyle = C.s; ctx.fillRect(8, 22, 16 - jump, 1); // Schatten

    const lift = (i) => walk && ((f < 2) === (i % 2 === 0)) ? 1 : 0;
    const wag = Math.floor(t / (happy ? 70 : 260)) % 2;
    const parts = [];
    [9, 12, 18, 21].forEach((lx, i) => parts.push([lx, Y(16), 2, 5 - lift(i) + (happy ? 0 : 0), 'b']));
    if (wag) parts.push([6, Y(8), 2, 3, 'b'], [5, Y(6), 2, 2, 'b']);
    else parts.push([5, Y(10), 3, 2, 'b'], [3, Y(9), 2, 2, 'b']);
    parts.push([8, Y(10), 15, 7, 'b'], [20, Y(4), 8, 8, 'b'], [26, Y(8), 5, 4, 'l']);
    for (const [px, py, w, h] of parts) { ctx.fillStyle = C.o; ctx.fillRect(px - 1, py - 1, w + 2, h + 2); }
    for (const [px, py, w, h, c] of parts) fill(px, py, w, h, c);

    fill(10, Y(14), 11, 2, 'l');             // Bauch
    fill(21, Y(5), 3, 6, 'e');               // Schlappohr
    fill(20, Y(9), 2, 4, 'c');               // rosa Halsband
    if (happy) { fill(24, Y(7), 1, 1, 'n'); fill(25, Y(6), 1, 1, 'n'); fill(26, Y(7), 1, 1, 'n'); } // ^-Auge
    else fill(25, Y(6), 1, 2, 'n');
    fill(30, Y(8), 1, 2, 'n');               // Nase
    const bark = happy && Math.floor(t / 140) % 2 === 0;
    if (bark) { fill(27, Y(11), 4, 1, 'n'); fill(27, Y(12), 2, 2, 't'); } // Maul auf + Zunge
    else if (happy) fill(27, Y(12), 2, 1, 't');
  }

  function loop(t) {
    const dt = Math.min(50, t - (lastT || t)); lastT = t;
    const max = Math.max(8, document.documentElement.clientWidth - 96 - 8);
    if (reduce) { x = max; dir = -1; }
    else if (t >= happyUntil) {
      x += dir * dt * 0.045;
      if (x > max) { x = max; dir = -1; }
      if (x < 8) { x = 8; dir = 1; }
      acc += dt; if (acc > 140) { acc = 0; frame++; }
    }
    el.style.transform = `translateX(${Math.round(x)}px)`;
    el.classList.toggle('left', dir < 0);
    draw(t);
    requestAnimationFrame(loop);
  }

  const BARKS = ['Wuff!', 'Wuff wuff!', 'Wuff! 🐾', 'Wuff? Wuff!'];
  const PRAISE = ['Wuff! Super gemacht!', 'Wuff! Stolz auf dich!', 'Wuff wuff! 🎉', 'Wuff! Weiter so, Jana!', 'Wuff! Geschafft! 🐾'];
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  function happy(msg) {
    happyUntil = performance.now() + 1500;
    bubble.textContent = msg || pick(PRAISE);
    // Sprechblase im Bildschirm halten, Pfeil zeigt auf den Hund
    const bw = bubble.offsetWidth, vw = document.documentElement.clientWidth, center = x + 48;
    const left = Math.min(Math.max(8, center - bw / 2), vw - bw - 8);
    bubble.style.left = (left - x) + 'px';
    bubble.style.setProperty('--arrow', (center - left) + 'px');
    bubble.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => bubble.classList.remove('show'), 1700);
  }
  window.janaDog = { happy };

  document.addEventListener('click', (e) => {
    if (e.dogHandled) return;
    const r = el.getBoundingClientRect();
    const onDog = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (onDog || e.target.closest('button')) happy(pick(BARKS));
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
